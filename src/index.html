<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <!-- 小图标：浏览器标签页、桌面快捷方式与手机主屏 -->
    <link rel="icon" type="image/png" sizes="48x48" href="./icon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="shortcut icon" href="./favicon.ico" sizes="any" />
    <link rel="alternate icon" href="./icon-48.png" type="image/png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="OxChat" />
    <!-- 主屏独立窗口：老 iOS 只认这个属性；状态栏用默认样式，避免顶栏被刘海压住 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="OxChat" />
    <title>OxChat</title>
    <script>
      // 启动兜底：脚本报错或长时间没渲染时，把原因直接画在页面上，而不是留一片白屏
      (function () {
        var shown = false
        function show(text) {
          if (shown) return
          shown = true
          window.__oxchatBootError = text
          try {
            var box = document.createElement('pre')
            box.style.cssText =
              'position:fixed;inset:0;margin:0;padding:16px;background:#fff;color:#b3261e;' +
              'font:12px/1.6 monospace;white-space:pre-wrap;overflow:auto;z-index:2147483647'
            box.textContent =
              'OxChat 启动失败\n\n' + text + '\n\n请把这段文字反馈给开发者（版本见 APK 文件名）。'
            document.body.appendChild(box)
          } catch (_) {}
        }
        window.addEventListener('error', function (event) {
          show(
            (event.message || '未知错误') +
              (event.filename ? '\n' + event.filename + ':' + event.lineno : '')
          )
        })
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason
          show('Promise 拒绝：' + (reason && reason.stack ? reason.stack : String(reason)))
        })
        setTimeout(function () {
          var root = document.getElementById('root')
          if (!root || root.childElementCount === 0) {
            show('页面在 15 秒内没有渲染出内容（JS 未执行或被系统拦截）。\nUA: ' + navigator.userAgent)
          }
        }, 15000)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
