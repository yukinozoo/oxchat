<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <!-- 小图标：浏览器标签页、桌面快捷方式与手机主屏 -->
    <link rel="icon" type="image/png" sizes="48x48" href="./icon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="shortcut icon" href="./favicon.ico" sizes="any" />
    <link rel="alternate icon" href="./icon-48.png" type="image/png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="OxChat" />
    <!-- 主屏独立窗口：老 iOS 只认这个属性；状态栏用默认样式，避免顶栏被刘海压住 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="OxChat" />
    <title>OxChat</title>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
